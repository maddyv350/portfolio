    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Set theme and intro mode before first paint so there's no flash.
      ;(function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('theme')
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          d.dataset.theme = t
        } catch (e) {
          d.dataset.theme = 'dark'
        }
        // full: first visit · quick: 600ms power-on (repeat visit or deep link) · none: reduced motion
        try {
          var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
          var deep = location.hash && location.hash !== '#home'
          d.dataset.intro = reduced ? 'none' : sessionStorage.getItem('onair:seen') || deep ? 'quick' : 'full'
        } catch (e) {
          d.dataset.intro = 'quick'
        }
        if (d.dataset.intro !== 'full' && d.dataset.theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEF2F7')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 24px">Sachin Verma, full-stack engineer. Email vermas7008@gmail.com. This site needs JavaScript for its TV intro.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
